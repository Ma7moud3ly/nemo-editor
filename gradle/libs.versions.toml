[versions]
project-packageName = "io.ma7moud3ly.nemo"
project-vendor = "github.com/Ma7moud3ly"
project-versionCode = "1"
project-versionName = "1.0.3"
android-compileSdk = "37"
android-targetSdk = "37"
android-minSdk = "23"
#plugins
agp = "9.3.2"
kotlin = "2.4.10"
composeHotReload = "1.2.0"
composeMultiplatform = "1.12.0"
kotlinSerialization = "2.4.10"
mavenPublish = "0.37.0"
#common
ui = "1.12.0"
uiToolingPreview = "1.12.0"
uiTooling = "1.12.0"
runtime = "1.12.0"
lifecycle-runtime = "2.11.0"
kotlinx-coroutines = "1.11.0"
navigation-compose = "2.9.2"
serialization-json = "1.11.0"
componentsResources = "1.12.0"
foundation = "1.12.0"
material3 = "1.9.0"
materialIconsExtended = "1.7.3"
kotlinxDatetime = "0.8.0"
adaptive = "1.2.0"
filekit = "0.15.0"
multiplatformSettings = "1.3.0"
#android
androidx-core = "1.19.0"
androidx-activity = "1.13.0"
firebaseBom = "34.18.0"
googleServices = "4.5.0"
firebaseCrashlytics = "3.0.8"

[libraries]
components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "componentsResources" }
foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "foundation" }
